name: MY Node Pipeline

on:
  push:
jobs:
  test-job:
    runs-on: ubuntu-latest
    steps:
      - name: checkout code
        uses: actions/checkout@v4

      - name: setup python
        uses: actions/setup-python@v5
        with:
          python-version: 3.12

      - name: install dependencies
        run: |
           python -m pip install --upgrade pip
           pip install -r requirements.txt
        
      - name: show files in current directory
        run: ls -la

      - name: run tests
        run: pytest -v --collect-only

  build-job:
   runs-on: ubuntu-latest
   needs: test-job
   steps:
    - name: checkout code
      uses: actions/checkout@v4
    - name: setup docker
      uses: docker/setup-buildx-action@v3
      with:
        driver: docker-container

    - name: login to docker hub
      uses: docker/login-action@v3
      with:
       username: ${{ secrets.DOCKER_USERNAME }}
       password: ${{ secrets.DOCKER_PASSWORD }}

    - name: build and push docker image
      run: |
        docker build -t weather_app .
        docker tag weather_app ${{ secrets.DOCKER_USERNAME }}/weather_app
        docker push ${{ secrets.DOCKER_USERNAME }}/weather_app

  deploy-job:
    runs-on: ubuntu-latest
    needs: build-job
    steps:
     - name: generate the ssh key file from github secrets as -i need pem file to login to ec2
       run: |
          echo "${{ secrets.EC2_SSH_KEY }}" > key.pem
          chmod 600 key.pem
     - name: Login to ec2 and run docker container
       run: |
           ssh -o StrictHostKeyChecking=no -i key.pem ${{ secrets.EC2_PUBLIC_USERNAME }}@${{ secrets.EC2_PUBLIC_IP }} \
           "
           sudo docker pull ${{ secrets.DOCKER_USERNAME }}/weather_app:latest
           sudodocker run -d --name my_weather_app-cont1 -p 5000:5000 ${{ secrets.DOCKER_USERNAME }}/weather_app:latest
           "